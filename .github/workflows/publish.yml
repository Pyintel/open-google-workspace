name: 🚀 Test, Build & Publish Arc Module to GitHub Packages (@pyintel)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🟢 Setup Node.js (GitHub Packages Registry)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pyintel'

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🧪 Run Enterprise Test Suite
        run: npm test

      - name: ⚡ Build Minified Standalone Bundle
        run: npm run build

      - name: 🚀 Publish to GitHub Packages Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
