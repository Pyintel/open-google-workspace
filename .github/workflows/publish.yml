name: 🚀 Test, Build & Publish Arc Module (Dual Registry: NPM + GitHub Packages)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🧪 Run Enterprise Test Suite
        run: npm test

      - name: ⚡ Build Minified Standalone Bundle
        run: npm run build

      - name: 💾 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: |
            dist/
            package.json
            ARC/
            skills/
            README.md

  publish-github-packages:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle

      - name: 🟢 Setup Node.js (GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pyintel'

      - name: 🚀 Publish to GitHub Packages (`npm.pkg.github.com`)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle

      - name: 🟢 Setup Node.js (NPM Registry)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: 🚀 Publish to NPM Registry (`npmjs.com`)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
